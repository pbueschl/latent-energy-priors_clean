experiment: medshape_diverse_sdf_final_eval
seed: 13

data:
  synset: medshape
  mesh_layout: class_subdirs
  mesh_root: data/raw/medshape_diverse
  sdf_root: data/sdf/medshape_diverse
  split_file: data/splits/medshape_diverse.json

artifacts:
  deepsdf_checkpoint: outputs/paper/medshape_diverse/deepsdf/deepsdf_final.pt
  conditional_energy_checkpoint: outputs/paper/medshape_diverse/conditional_energy/conditional_energy_prior_best_loss.pt
  l2_validation_selection_root: outputs/paper/medshape_diverse/l2_val

deepsdf:
  sdf_clamp: 0.1

sparse_sweep:
  split: test
  steps: [0, 25, 50, 100, 250, 500, 1000, 1500, 2000]
  observation_points: 16
  eval_points: 8192
  lr: 0.01
  lambda_l2: 0.001
  lambda_conditional_energy: 0.00003
  repeats: 3
  variants:
    - name: no_prior
      method: no_prior
      lambda_l2: 0.0
      lambda_conditional_energy: 0.0
    - name: l2_lam_1e_3
      method: l2
      lambda_l2: 0.001
      lambda_conditional_energy: 0.0
    - name: conditional_lam_1e_5
      method: conditional_energy
      lambda_l2: 0.0
      lambda_conditional_energy: 0.00001
    - name: l2_conditional_l2_1e_3_cond_3e_5
      method: l2_conditional_energy
      lambda_l2: 0.001
      lambda_conditional_energy: 0.00003
  grid_metrics:
    enabled: true
    mesh_root: data/raw/medshape_diverse
    synset: medshape
    mesh_layout: class_subdirs
    grid_size: 64
    bounds: 1.15
    sdf_clamp: 0.1
    threshold: 0.0
    steps: [250, 500, 1000, 1500, 2000]
    batch_points: 262144
    gt_batch_points: 262144
    allow_non_watertight_gt: true
