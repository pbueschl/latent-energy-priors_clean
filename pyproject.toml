[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-energy-priors"
version = "0.1.0"
description = "Reference implementation for latent energy priors in test-time INR optimization."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Anonymous Authors"}
]
dependencies = [
  "numpy>=1.23",
  "torch>=2.0",
  "pyyaml>=6.0",
  "tqdm>=4.64"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0"
]
preprocess = [
  "trimesh>=4.0",
  "point-cloud-utils>=0.30",
  "rtree>=1.0"
]
viz = [
  "matplotlib>=3.7"
]
tiff = [
  "tifffile>=2023.8"
]

[tool.setuptools.packages.find]
include = ["lep*"]
